<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mom Tips - Daily Tips</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header Navigation -->
  <header class="top-nav">
    <h1>Mom Tips</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="addtip.html">Add Tip</a></li>
        <li><a href="dailytips.html" class="active">Daily Tips</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section id="dynamic-content">
      <h2>Daily Tips</h2>
      <div id="content-container" class="tips-list">
        <!-- Tips will be dynamically inserted here -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 Mom Tips. All rights reserved.</p>
  </footer>

  <!-- Script: Load Original + User Tips -->
  <script>
    // Original tips
    const tips = [
      {
        title: "Cleaning Hack",
        description: "Microwave lemon water for 3 minutes to loosen grime — wipe clean easily!",
        category: "Cleaning",
        author: "MomJane"
      },
      {
        title: "Meal Prep Sunday",
        description: "Chop fruits and veggies ahead of time to save weekday stress.",
        category: "Meal Prep",
        author: "HealthyMom"
      },
      {
        title: "Morning Self-Care",
        description: "Stretch and take 5 deep breaths before starting your day.",
        category: "Self Care",
        author: "SelfCareMom"
      },
      {
        title: "Playtime Fun",
        description: "Use recycled boxes to create a fun obstacle course for your kids.",
        category: "Play Ideas",
        author: "CreativeMom"
      },
      {
        title: "Quick Breakfast",
        description: "Overnight oats with fruit are easy, healthy, and quick for busy mornings.",
        category: "Meal Prep",
        author: "HealthyMom"
      }
    ];

    // Container for tips
    const container = document.getElementById("content-container");

    // Load user-submitted tips from localStorage
    const userTips = JSON.parse(localStorage.getItem("userTips") || "[]");

    // Combine original + user tips
    const allTips = [...tips, ...userTips];

    // Display each tip
    allTips.forEach(tip => {
      const tipDiv = document.createElement("article");
      tipDiv.classList.add("tip-card");

      const title = document.createElement("h3");
      title.textContent = tip.title;

      const description = document.createElement("p");
      description.textContent = tip.description;

      const meta = document.createElement("small");
      meta.textContent = `Category: ${tip.category} | Author: ${tip.author || "Anonymous"}`;

      tipDiv.appendChild(title);
      tipDiv.appendChild(description);
      tipDiv.appendChild(meta);

      container.appendChild(tipDiv);
    });
  </script>

</body>
</html>
