<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mom Tips - Profile</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-nav">
  <h1>Mom Tips</h1>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="addtip.html">Add Tip</a></li>
      <li><a href="dailytips.html">Daily Tips</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="profile-section">
    <h2>MomJane</h2>
    <p>Sharing daily tips to make life easier for busy moms!</p>
  </section>

  <section class="tips-list">
    <h2>My Tips</h2>
    <div id="myTipsContainer"></div>
  </section>
</main>

<footer>
  <p>© 2025 Mom Tips. All rights reserved.</p>
</footer>

<script>
  const currentUser = "MomJane";
  const container = document.getElementById("myTipsContainer");

  const userTips = JSON.parse(localStorage.getItem("userTips_" + currentUser) || "[]");

  if (userTips.length === 0) {
    container.innerHTML = "<p>You haven't submitted any tips yet.</p>";
  } else {
    userTips.forEach(tip => {
      const article = document.createElement("article");
      article.innerHTML = `
        <header><strong>${tip.title}</strong></header>
        <p>${tip.description}</p>
        <footer><small>Category: ${tip.category}</small></footer>
      `;
      container.appendChild(article);
    });
  }
</script>

</body>
</html>
