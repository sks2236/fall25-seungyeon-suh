<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mom Tips - Favorites</title>
 <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top-nav">
  <h1>Mom Tips</h1>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="addtip.html">Add Tip</a></li>
      <li><a href="dailytips.html">Daily Tips</a></li>
      <li><a href="favorites.html" class="active">Favorites</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="tips-list">
    <h2>Favorite Tips</h2>
    <div id="favoritesContainer"></div>
  </section>
</main>

<footer>
  <p>© 2025 Mom Tips. All rights reserved.</p>
</footer>

<script>
  const container = document.getElementById("favoritesContainer");

  // Load all tips and liked tips
  const allTips = JSON.parse(localStorage.getItem("allTips") || "[]");
  const likedTips = JSON.parse(localStorage.getItem("likedTips") || "[]");

  const favorites = allTips.filter(tip => likedTips.includes(tip.title));

  if (favorites.length === 0) {
    container.innerHTML = "<p>You haven't liked any tips yet.</p>";
  } else {
    favorites.forEach(tip => {
      const article = document.createElement("article");
      article.innerHTML = `
        <header><strong>${tip.title}</strong> • <small>${tip.author}</small></header>
        <p>${tip.description}</p>
        <footer><small>Category: ${tip.category}</small></footer>
      `;
      container.appendChild(article);
    });
  }
</script>

</body>
</html>
